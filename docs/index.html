'use strict';
//#SIM-START
// ================= SIMULATION (no DOM) =================
const DEG=Math.PI/180, G=9.81, R=4.5, SL=50, U_COM=20, PIN_U=35, PIN_OUT=1.6, NOSE_U=38;
const TOWER_HW=6, TOWER_H=146, CATCH_X=24, ARM_Y=106, ARM_LEN=30, HINGE_X=6, HINGE_Z=6.5, ARM_T=3;
const PHI_C=Math.atan2((R+0.6)-HINGE_Z, CATCH_X-HINGE_X), PHI_O=30*DEG;
const OLM_X=CATCH_X, OLM_HW=12, OLM_Y=22, QD_Y0=70, QD_Y1=75, QD_X1=17;
const K_SIDE=G/(85*85), K_END=G/(210*210);
const ARM_CLOSE_T=1.0, MAX_IMPACT=7, FLIP_ALT_AUTO=560, FLIP_WIN=[350,800];
const SAMPLE_U=[-2.5,4,12,20,28,36,44,49.5];
const LEVELS=[
 {id:1,name:'CATCH TIMING',flip:'auto',burn:'auto',arms:'manual',fuel:360,inertia:false,wind:false,eout:0,pal:0,
  desc:['AUTOPILOT FLIES THE FLIP AND BURN.','YOU CLOSE THE CHOPSTICKS WITH SPACE.','ARMS TAKE 1.0 S - ANTICIPATE!']},
 {id:2,name:'FLIP + CATCH',flip:'manual',burn:'auto',arms:'manual',fuel:310,inertia:false,wind:false,eout:0,pal:1,
  desc:['SPACE LIGHTS THE RAPTORS AND FLIPS.','TOO LOW = NO ROOM. TOO HIGH = NO FUEL.','SPACE AGAIN CLOSES THE ARMS.']},
 {id:3,name:'PILOT',flip:'manual',burn:'manual',arms:'auto',fuel:400,inertia:false,wind:false,eout:0,pal:2,
  desc:['FLY IT YOURSELF. ← → ROTATE, ↑ THRUST,','↓ OR SHIFT FINE THRUST.','MECHAZILLA CLOSES WHEN YOU HOLD STILL.'],
  descT:['FLY IT YOURSELF WITH THE BUTTONS:','← → ROTATE, ↑ THRUST, ↓ FINE THRUST.','MECHAZILLA CLOSES WHEN YOU HOLD STILL.']},
 {id:4,name:'COMMANDER',flip:'manual',burn:'manual',arms:'manual',fuel:350,inertia:true,wind:true,eout:0.45,pal:3,
  desc:['ROTATIONAL INERTIA, GUSTY WIND,','TIGHT FUEL, POSSIBLE ENGINE-OUT.','SPACE OPENS/CLOSES ARMS. CUT THRUST TO SETTLE.'],
  descT:['ROTATIONAL INERTIA, GUSTY WIND,','TIGHT FUEL, POSSIBLE ENGINE-OUT.','ARMS BUTTON OPENS/CLOSES. LET GO TO SETTLE.']}
];
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function wrap(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}
function newSim(lv){
 return {lv,t:0,x:-400,y:1680,vx:36,vy:-80,th:90*DEG,om:0,thr:0,thrCmd:0,lit:false,everLit:false,maxThr:39,
  fuel:lv.fuel,fuel0:lv.fuel,phase:'glide',arm:1,armCmd:1,locked:false,caught:false,dead:false,failed:false,abort:false,cut:false,
  result:null,msgs:[],events:[],prevPin:1e9,flipAlt:null,eoutAt:-1,eout:false,bounce:0,bv:0,wind:0,gust:0,impact:0,ignT:0,boomAt:null};
}
function msg(s,text,col){s.msgs.push({t:s.t,text,col:col||'#ffffff'});}
function shipPt(s,u,v){const sn=Math.sin(s.th),cs=Math.cos(s.th);return [s.x+sn*(u-U_COM)+cs*v, s.y+cs*(u-U_COM)-sn*v];}
function pinY(s){return s.y+Math.cos(s.th)*(PIN_U-U_COM);}
function xAtY(s,y){const cs=Math.cos(s.th);if(Math.abs(cs)<0.15)return s.x;return s.x+Math.sin(s.th)*(y-s.y)/cs;}
function shipSpan(s){const a=shipPt(s,-2.5,0)[1],b=shipPt(s,SL,0)[1];return {lo:Math.min(a,b)-R*Math.abs(Math.sin(s.th)),hi:Math.max(a,b)+R*Math.abs(Math.sin(s.th))};}
function armPhi(o){return PHI_C+o*(PHI_O-PHI_C);}
function armGeom(o,xa){const p=armPhi(o),c=Math.cos(p),sn=Math.sin(p);return {d:HINGE_Z*c+sn*(xa-HINGE_X),t:c*(xa-HINGE_X)-sn*HINGE_Z};}
function windAt(s){if(!s.lv.wind)return 0;const t=s.t;return 6+4*Math.sin(t*0.27)+2.5*Math.sin(t*1.13+1.3)+s.gust;}
function engCount(s){if(s.thr<0.3)return 0;return clamp(Math.ceil(s.thr/13-0.05),1,s.eout?2:3);}
function guidance(s){
 const py=pinY(s);let vyDes;
 if(s.phase==='descent')vyDes=-2.4;
 else{const hold=s.x<CATCH_X-7?Math.max(0,TOWER_H+35-(ARM_Y+12)):0;const e=py-(ARM_Y+12+hold);vyDes=e>0?-Math.sqrt(2*8.5*e):Math.min(2.5,-e*0.5);}
 let ay=G+2.4*(vyDes-s.vy);
 const vxDes=clamp((CATCH_X-s.x)*0.32,-24,24);
 let ax=1.5*(vxDes-s.vx);
 ay=Math.max(ay,3);const tm=Math.tan(26*DEG);ax=clamp(ax,-ay*tm,ay*tm);
 return {th:Math.atan2(ax,ay),a:Math.hypot(ax,ay)};
}
function ignite(s){
 s.lit=true;s.everLit=true;s.flipAlt=s.y;s.phase='flip';s.ignT=s.t;
 msg(s,'RAPTOR IGNITION - FLIP','#ffd27a');s.events.push({type:'ignite'});
 if(s.lv.eout&&Math.random()<s.lv.eout)s.eoutAt=s.t+1.0+Math.random()*1.6;
}
function fail(s,title,detail){
 if(s.failed)return;s.failed=true;s.result={ok:false,title,detail,lines:[]};
 if(s.lv.burn==='auto'){s.abort=true;s.cut=true;}
 msg(s,title,'#ff6a50');
}
function explode(s,title,detail){
 const v=Math.hypot(s.vx,s.vy);s.impact=s.impact||v;s.dead=true;s.failed=true;s.thr=0;s.lit=false;
 if(!s.result)s.result={ok:false,title,detail,lines:[]};
 s.result.lines.push('IMPACT '+(v*3.6).toFixed(0)+' KM/H');
 s.events.push({type:'boom',x:s.x,y:s.y});s.boomAt=s.t;
}
function onLock(s){
 s.events.push({type:'clank'});msg(s,'ARMS LOCKED','#9ef08a');
 const py=pinY(s),xa=xAtY(s,ARM_Y),sp=shipSpan(s);
 if((s.lv.burn==='auto'||s.lv.arms==='auto')&&py>ARM_Y-0.3&&py<ARM_Y+30&&!s.cut){s.cut=true;msg(s,'ENGINE CUTOFF','#9ef08a');}
 if(sp.lo<ARM_Y&&sp.hi>ARM_Y&&py<ARM_Y-0.3&&Math.abs(xa-CATCH_X)<8){
  if(s.lv.burn==='auto')fail(s,'TOO LATE','THE ARMS CLOSED ABOVE THE PINS');
  else msg(s,'PINS BELOW THE ARMS - OPEN AND RETRY','#ff6a50');
 }
}
function contact(s,xa){
 const vI=-s.vy,dx=xa-CATCH_X,tilt=Math.abs(s.th)/DEG,vxa=Math.abs(s.vx);
 s.impact=vI;
 if(vI>=MAX_IMPACT)return explode(s,'ARMS OVERLOADED','HIT THE ARMS AT '+vI.toFixed(1)+' M/S (MAX 7)');
 if(Math.abs(dx)>=3)return explode(s,'OFF THE CATCH RAILS','PINS LANDED '+Math.abs(dx).toFixed(1)+' M OFF CENTER');
 if(tilt>=10)return explode(s,'CAUGHT TILTED','TILT '+tilt.toFixed(0)+' DEG (MAX 10)');
 if(vxa>=3)return explode(s,'SIDE LOAD','SIDEWAYS '+vxa.toFixed(1)+' M/S (MAX 3)');
 s.caught=true;s.phase='caught';s.vx=0;s.vy=0;s.om=0;s.lit=false;s.cut=true;s.thrCmd=0;s.armCmd=0;
 s.bv=-vI*0.55;s.bounce=0;s.y+=ARM_Y-pinY(s);s.catchY=s.y;
 const fuelPct=s.fuel/s.fuel0*100;
 const score=Math.round((1000+Math.max(0,MAX_IMPACT-vI)*150+Math.max(0,3-Math.abs(dx))*120+fuelPct*4+Math.max(0,10-tilt)*15)*(0.75+0.25*s.lv.id));
 const grade=(vI<3&&Math.abs(dx)<0.8&&tilt<3)?'S':(vI<4.5&&Math.abs(dx)<1.5)?'A':vI<6?'B':'C';
 s.result={ok:true,title:'SHIP CAUGHT!',grade,score,lines:[
  'CONTACT  '+vI.toFixed(1)+' M/S','OFFSET   '+(dx>=0?'+':'')+dx.toFixed(2)+' M','TILT     '+tilt.toFixed(1)+' DEG','PROPELLANT LEFT '+fuelPct.toFixed(0)+'%']};
 s.events.push({type:'catch'});msg(s,'SHIP CAUGHT!','#9ef08a');
}
function step(s,dt,inp){
 const lv=s.lv;s.t+=dt;
 if(s.dead)return;
 if(s.caught){
  s.bv+=(-s.bounce*60-s.bv*4)*dt;s.bounce+=s.bv*dt;s.th+=(0-s.th)*Math.min(1,dt*3);
  s.thr=Math.max(0,s.thr-90*dt);s.arm=Math.max(0,s.arm-dt/ARM_CLOSE_T);s.y=s.catchY+s.bounce;return;
 }
 if(lv.wind){if(Math.random()<dt*0.18)s.gust=(Math.random()*2-1)*9;s.gust*=Math.exp(-dt*0.6);}
 // ---- SPACE
 if(inp.space&&!s.failed){
  if(lv.flip==='manual'&&lv.burn==='auto'&&!s.everLit)ignite(s);
  else if(lv.arms==='manual'){
   if(lv.id===4){s.armCmd=s.armCmd?0:1;msg(s,s.armCmd?'ARMS OPENING':'ARMS CLOSING','#ffd27a');s.events.push({type:'arm'});}
   else if(s.armCmd===1){
    if(pinY(s)>ARM_Y+45||!s.everLit)msg(s,'TOO EARLY - WAIT FOR FINAL DESCENT','#ff9a6a');
    else{s.armCmd=0;msg(s,'CHOPSTICKS CLOSING','#ffd27a');s.events.push({type:'arm'});}
   }
  }
 }
 if(s.eoutAt>0&&s.t>=s.eoutAt&&!s.eout){s.eout=true;s.maxThr*=2/3;msg(s,'RAPTOR 2 OUT - 2 ENGINES LEFT','#ff6a50');s.events.push({type:'eout'});}
 if(lv.flip==='auto'&&!s.everLit&&s.y<FLIP_ALT_AUTO)ignite(s);
 if(lv.burn==='manual'&&!s.everLit&&(inp.up||inp.fine)&&!s.failed)ignite(s);
 // ---- attitude
 let g=null;
 const autoAtt=lv.burn==='auto'&&!s.abort;
 if(autoAtt){
  let thDes,rateMax;
  if(!s.lit){
   const tTo=Math.max(1,(s.y-330)/Math.max(10,-s.vy));const xPred=s.x+s.vx*tTo;const err=(CATCH_X+12)-xPred;
   s.lcOv=clamp(0.3+err*0.0035,0,0.7);const pr=clamp((1680-s.y)/1100,0,1);thDes=Math.PI/2-pr*pr*(3-2*pr)*7*DEG;rateMax=3*DEG;
  }else{g=guidance(s);thDes=g.th;if(s.phase==='flip')thDes=Math.max(thDes,-22*DEG);rateMax=75*DEG;}
  const omT=clamp(wrap(thDes-s.th)*2.8,-rateMax,rateMax);
  s.om+=clamp(omT-s.om,-170*DEG*dt,170*DEG*dt);
 }else if(s.abort){s.om*=Math.exp(-dt*0.5);}
 else if(!lv.inertia){s.om=((inp.right?1:0)-(inp.left?1:0))*60*DEG;}
 else{
  const q=Math.min(1.5,(s.vx*s.vx+s.vy*s.vy)/7225);const ip=(inp.right?1:0)-(inp.left?1:0);
  const auth=2.2*(s.thr/27)+0.9*q+0.3;
  s.om+=(ip*auth+0.6*q*Math.sin(2*s.th)+s.gust*0.01)*dt;s.om*=Math.exp(-dt*0.8);
 }
 s.th=wrap(s.th+s.om*dt);
 // ---- throttle
 if(s.lit&&!s.abort&&!s.cut){
  if(lv.burn==='auto'){if(!g)g=guidance(s);let a=g.a;if(s.phase==='flip'&&Math.abs(wrap(g.th-s.th))>30*DEG)a=0.5*s.maxThr;const minA=Math.hypot(s.vx,s.vy)>22?15.6*(s.eout?2/3:1):5.2;s.thrCmd=clamp(a,minA,s.maxThr*0.82);}
  else s.thrCmd=inp.up?s.maxThr*0.69:inp.fine?10.8:0;
 }else s.thrCmd=0;
 s.thr+=clamp(s.thrCmd-s.thr,-90*dt,70*dt);if(s.thr<0)s.thr=0;
 if(s.thr>0){s.fuel-=s.thr*dt;if(s.fuel<=0){s.fuel=0;s.thr=0;if(s.lit){s.lit=false;msg(s,'PROPELLANT DEPLETED - FLAMEOUT','#ff6a50');if(lv.burn==='auto')fail(s,'OUT OF PROPELLANT',s.flipAlt>FLIP_WIN[1]-60?'FLIPPED TOO EARLY - THE TANKS RAN DRY':'THE TANKS RAN DRY');}}}
 // ---- dynamics
 const w=windAt(s);s.wind=w;
 let ax=0,ay=-G;const rvx=s.vx-w,rvy=s.vy,sp=Math.hypot(rvx,rvy);
 if(sp>0.1){
  const ux=rvx/sp,uy=rvy/sp,sn=Math.sin(s.th),cs=Math.cos(s.th),ca=ux*sn+uy*cs,sa2=1-ca*ca;
  const D=(K_SIDE*sa2+K_END*ca*ca)*sp*sp;ax-=ux*D;ay-=uy*D;
  if(sa2>0.4){const lc=(s.lcOv!=null&&!s.lit?s.lcOv:clamp(0.3+1.5*(Math.abs(s.th)-Math.PI/2),0,0.7))*(sa2-0.4)/0.6;let px=-uy,py=ux;if(px*sn+py*cs<0){px=-px;py=-py;}ax+=px*D*lc;ay+=py*D*lc;}
 }
 if(lv.wind)ax+=(w-s.vx)*0.05;
 ax+=Math.sin(s.th)*s.thr;ay+=Math.cos(s.th)*s.thr;
 s.vx+=ax*dt;s.vy+=ay*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
 // ---- arms
 if(s.demo&&s.armCmd===1&&s.phase==='descent'&&!s.failed&&pinY(s)-ARM_Y+s.vy*ARM_CLOSE_T<0.15){s.armCmd=0;msg(s,'CHOPSTICKS CLOSING','#ffd27a');s.events.push({type:'arm'});}
 if(lv.arms==='auto'&&s.armCmd===1&&!s.failed){
  const py=pinY(s),pred=py-ARM_Y+s.vy*ARM_CLOSE_T,dx=xAtY(s,ARM_Y)-CATCH_X;
  if(py>ARM_Y&&pred>0.2&&pred<1.8&&Math.abs(dx)<2.5&&Math.abs(s.th)<9*DEG&&Math.abs(s.vy)<5){s.armCmd=0;msg(s,'MECHAZILLA CLOSING','#ffd27a');s.events.push({type:'arm'});}
 }
 s.arm=clamp(s.arm+clamp(s.armCmd-s.arm,-dt/ARM_CLOSE_T,dt/ARM_CLOSE_T),0,1);
 const lk=s.armCmd===0&&s.arm<=0;
 if(lk&&!s.locked){s.locked=true;onLock(s);}else if(!lk)s.locked=false;
 // ---- phases
 const py=pinY(s);
 if(s.everLit&&!s.failed){
  if(lv.burn==='auto'){
   if(s.phase==='flip'){if(!g)g=guidance(s);if(Math.abs(wrap(g.th-s.th))<10*DEG&&Math.abs(s.th)<35*DEG)s.phase='burn';}
   else if(s.phase==='burn'&&Math.abs(py-(ARM_Y+12))<2.5&&Math.abs(s.vy)<3&&Math.abs(s.x-CATCH_X)<2.5){s.phase='descent';msg(s,'FINAL DESCENT','#ffffff');}
   if(s.phase==='descent'&&s.armCmd===1&&py<ARM_Y-1.5)fail(s,'TOO LATE','THE PINS PASSED THE ARMS');
  }else{
   if(s.phase==='flip'&&Math.abs(s.th)<35*DEG)s.phase='burn';
   if(s.phase==='burn'&&py<ARM_Y+25&&Math.abs(s.x-CATCH_X)<40)s.phase='final';
  }
 }
 // ---- pin contact
 if(s.prevPin>=ARM_Y&&py<ARM_Y){
  const xa=xAtY(s,ARM_Y),ag=armGeom(s.arm,xa);
  if(ag.d<R+PIN_OUT-0.1&&ag.t>-1&&ag.t<ARM_LEN+1&&Math.abs(s.th)<40*DEG){s.prevPin=py;return contact(s,xa);}
 }
 s.prevPin=py;
 // ---- hull strike
 const span=shipSpan(s);
 if(span.lo<ARM_Y&&span.hi>ARM_Y-ARM_T){const xa=xAtY(s,ARM_Y-1),ag=armGeom(s.arm,xa);
  if(ag.d<R-0.15&&ag.t>0&&ag.t<ARM_LEN)return explode(s,'HULL STRIKE','A CHOPSTICK HIT THE HULL');}
 // ---- structures and ground
 for(const u of SAMPLE_U)for(const v of [-R,0,R]){
  const p=shipPt(s,u,v),X=p[0],Y=p[1];let t=null,d='';
  if(Y<0){const sp2=Math.hypot(s.vx,s.vy);
   if(!s.everLit){t='NO FLIP';d='BELLY-FLOPPED INTO THE MARSH';}
   else if(sp2<5){t='TIPPED OVER';d='STARSHIP HAS NO LANDING LEGS HERE';}else{t='RAPID UNSCHEDULED DISASSEMBLY';d='GROUND IMPACT';}}
  else if(Math.abs(X-OLM_X)<OLM_HW&&Y<OLM_Y){t='LAUNCH MOUNT STRIKE';d='THE SHIP HIT THE OLM';}
  else if(Math.abs(X)<TOWER_HW&&Y<TOWER_H+3){t='TOWER STRIKE';d='THE SHIP HIT MECHAZILLA';}
  else if(X>TOWER_HW&&X<QD_X1&&Y>QD_Y0&&Y<QD_Y1){t='QD ARM STRIKE';d='THE SHIP HIT THE QUICK-DISCONNECT ARM';}
  else if(X>TOWER_HW-1&&X<HINGE_X+3&&Y>ARM_Y-8&&Y<ARM_Y+5){t='CARRIAGE STRIKE';d='THE SHIP HIT THE ARM CARRIAGE';}
  if(t)return explode(s,t,d);
 }
}

function noiseBurst(dur,vol,f0){if(!AC||muted)return;const s=AC.createBufferSource();s.buffer=eng.b;const f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(60,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,Math.random());s.stop(t+dur);}
function crowdSnd(k){if(!AC||muted)return;const s=AC.createBufferSource();s.buffer=eng.b;s.loop=true;const f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;
 f.type='bandpass';f.Q.value=k==='gasp'?1.4:0.8;f.frequency.setValueAtTime(k==='gasp'?520:1300,t);if(k==='gasp')f.frequency.linearRampToValueAtTime(380,t+0.9);

 s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,Math.random());s.stop(t+dur);}
function sfx(e){if(e.type==='clank'){tone('square',140,55,0.35,0.18);noiseBurst(0.25,0.4,2000);}else if(e.type==='boom'){noiseBurst(2.6,1.2,1400);tone('sine',70,25,1.5,0.5);}
 else if(e.type==='catch'){tone('sine',660,660,0.25,0.15);setTimeout(()=>tone('sine',990,990,0.4,0.15),180);}else if(e.type==='ignite'){noiseBurst(0.6,0.6,900);}else if(e.type==='arm'){tone('sawtooth',90,120,0.9,0.05);}else if(e.type==='eout'){tone('square',300,120,0.4,0.12);}

let demoPal=-1;

 sim=newSim(lv);sim.demo=true;setPal(demoPal);mode='play';PTS=[];resultAt=0;paused=false;const c=camTarget(sim);camX=c[0];camY=c[1];prevCT=null;shake=0;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(e.pointerType==='touch')isTouch=true;audioInit();if(AC&&AC.state==='suspended')AC.resume();

 const ck=ctlAt(px,py);if(ck){TOUCHES[e.pointerId]=ck;if(ck==='arms')spaceEdge=true;return;}
 for(let i=UIBTN.length-1;i>=0;i--){const b=UIBTN[i];if(px>=b.x&&px<b.x+b.w&&py>=b.y&&py<b.y+b.h){b.act();return;}}
 if(mode!=='play'||!sim||sim.demo)return;
 if(sim.result&&resultAt)return;

 if(sim.lv.id===1&&sim.phase==='glide'){touchFF=true;return;}
 if(sim.lv.id===2&&!sim.everLit){touchDown=performance.now();ffTimer=setTimeout(()=>{touchFF=true;},220);return;}
 spaceEdge=true;});
let touchDown=0,ffTimer=null;
cv.addEventListener('pointermove',e=>{if(!(e.pointerId in TOUCHES))return;const r=cv.getBoundingClientRect(),k=ctlAt((e.clientX-r.left)/PS,(e.clientY-r.top)/PS);if(k&&k!=='arms'&&TOUCHES[e.pointerId]!=='arms')TOUCHES[e.pointerId]=k;else if(!k&&TOUCHES[e.pointerId]!=='arms')TOUCHES[e.pointerId]=null;});
const relT=e=>{delete TOUCHES[e.pointerId];};addEventListener('pointerup',relT);addEventListener('pointercancel',relT);
addEventListener('pointerup',()=>{if(touchDown){clearTimeout(ffTimer);if(!touchFF&&performance.now()-touchDown<220)spaceEdge=true;touchDown=0;}touchFF=false;});addEventListener('pointercancel',()=>{touchFF=false;touchDown=0;clearTimeout(ffTimer);});
function startLevel(i){spawnBirds();WRECK=null;prevCT=null;sel=i;sim=newSim(LEVELS[i]);setPal(LEVELS[i].pal);mode='play';PTS=[];resultAt=0;paused=false;const c=camTarget(sim);camX=c[0];camY=c[1];shake=0;}

addEventListener('keydown',e=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();const c=e.code;

});

 if(mode==='play'&&!paused){
  const ts=sim.demo?(sim.phase==='glide'?2.5:1):((keys.KeyT||touchFF)&&sim.phase==='glide'&&!sim.failed)?4:1;let rem=dt*ts;
  const inp={left:keys.ArrowLeft||keys.KeyA,right:keys.ArrowRight||keys.KeyD,up:keys.ArrowUp||keys.KeyW,fine:keys.ArrowDown||keys.KeyS||keys.ShiftLeft||keys.ShiftRight,space:spaceEdge};{const tc=touchCtl();inp.left=inp.left||tc.left;inp.right=inp.right||tc.right;inp.up=inp.up||tc.up;inp.fine=inp.fine||tc.fine;}if(sim.demo){inp.left=inp.right=inp.up=inp.fine=inp.space=false;}

  const c=camTarget(sim),k=1-Math.exp(-dt*3);if(prevCT){camX+=c[0]-prevCT[0];camY+=c[1]-prevCT[1];}prevCT=c;camX+=(c[0]-camX)*k;camY+=(c[1]-camY)*k;

 render(T,dt);requestAnimationFrame(frame);}
